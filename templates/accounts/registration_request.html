{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Request Registration - WMRS{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 p-4">
                <h2 class="text-center mb-4 text-success">Join Agruni WMRS</h2>
                <p class="text-muted text-center mb-4">Submit your details and we will set up your account.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg">Submit Request</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <small>Already have an account? <a href="{% url 'login' %}">Login here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
