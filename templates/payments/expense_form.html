{% extends "dashboard/dashboard_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Record Expense - WMRS{% endblock %}
{% block header %}Record Operational Expense{% endblock %}

{% block dashboard_content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="mt-4">
                    <button type="submit" class="btn btn-danger">Record Expense</button>
                    <a href="{% url 'dashboard:index' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
