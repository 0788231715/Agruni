{% extends "dashboard/dashboard_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Add Vehicle - WMRS{% endblock %}
{% block header %}Vehicle Enrollment{% endblock %}

{% block dashboard_content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm p-4">
            <h5 class="fw-bold mb-4 text-success">New Vehicle Details</h5>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex gap-2 justify-content-end mt-4">
                    <a href="{% url 'collection:vehicle_list' %}" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-success px-5 fw-bold shadow-sm">Register Vehicle</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
